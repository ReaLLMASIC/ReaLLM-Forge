<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D trajectory sweep selector</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0f172a;color:#f8fafc;font:14px system-ui}body{display:grid;grid-template-columns:330px 1fr}aside{padding:18px;border-right:1px solid #334155;overflow:auto}h1{font-size:20px}label{display:block;color:#94a3b8;margin:14px 0 5px}select{width:100%;padding:9px;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:8px}#runs{margin-top:15px;display:grid;gap:7px}button{padding:9px;text-align:left;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:8px;cursor:pointer}button.active,button:hover{border-color:#38bdf8}iframe{width:100%;height:100%;border:0}.muted{color:#94a3b8;line-height:1.4}</style></head>
<body><aside><h1>Trajectory sweep</h1><p class="muted">Filter configurations, then select a run. The URL updates so this view can be bookmarked or shared.</p><label>Embedding dimension</label><select id="dim"><option value="">All</option></select><label>Embedding radius</label><select id="radius"><option value="">All</option></select><label>Trained symbols</label><select id="trained"><option value="">All</option></select><label>Held-out letters</label><select id="held"><option value="">All</option></select><label>Affected symbols</label><select id="dropped"><option value="">All</option></select><label>Schedule</label><select id="schedule"><option value="">All</option><option value="drop">Included → excluded</option><option value="add">Excluded → included</option><option value="duty_cycle">Duty cycle</option></select><label>Transition / duty %</label><select id="dropPercent"><option value="">All</option></select><label>Optimizer</label><select id="optimizer"><option value="">All</option></select><label>Weight decay</label><select id="weightDecay"><option value="">All</option></select><label>WTE / LM head</label><select id="tying"><option value="">All</option><option value="true">Tied</option><option value="false">Untied</option></select><div id="runs"></div></aside><iframe id="viewer" title="Token trajectory viewer"></iframe>
<script>
const state={runs:[],selected:null};
const dimSelect=document.querySelector('#dim'),radiusSelect=document.querySelector('#radius'),trainedSelect=document.querySelector('#trained'),heldSelect=document.querySelector('#held'),droppedSelect=document.querySelector('#dropped'),scheduleSelect=document.querySelector('#schedule'),dropPercentSelect=document.querySelector('#dropPercent'),optimizerSelect=document.querySelector('#optimizer'),weightDecaySelect=document.querySelector('#weightDecay'),tyingSelect=document.querySelector('#tying'),runList=document.querySelector('#runs'),viewer=document.querySelector('#viewer');
const filters={dim:dimSelect,radius:radiusSelect,trained:trainedSelect,held:heldSelect,dropped:droppedSelect,schedule:scheduleSelect,percent:dropPercentSelect,optimizer:optimizerSelect,weight_decay:weightDecaySelect,tying:tyingSelect};
const unique=key=>[...new Set(state.runs.map(run=>run[key]))].sort((a,b)=>a-b);
function updateUrl(){const params=new URLSearchParams;Object.entries(filters).forEach(([key,select])=>{if(select.value)params.set(key,select.value)});if(state.selected)params.set('run',state.selected.name);history.replaceState(null,'',`${location.pathname}${params.size?`?${params}`:''}${location.hash}`)}
function selectRun(run){state.selected=run;viewer.src=`viewer.html?data=${encodeURIComponent(run.file)}`;updateUrl();render()}
function render(){
  const valueOf=run=>run.transition_mode==='duty_cycle'?run.duty_cycle:Math.round(100*run.dropout_iteration/run.final_iteration),radiusOf=run=>run.fixed_norm==null?'free':String(run.fixed_norm);const filtered=state.runs.filter(run=>(!dimSelect.value||run.embedding_dim==dimSelect.value)&&(!radiusSelect.value||radiusOf(run)===radiusSelect.value)&&(!trainedSelect.value||run.trained_tokens==trainedSelect.value)&&(!heldSelect.value||run.held_out_tokens==heldSelect.value)&&(!droppedSelect.value||run.dropped_tokens==droppedSelect.value)&&(!scheduleSelect.value||run.transition_mode===scheduleSelect.value)&&(!dropPercentSelect.value||valueOf(run)==dropPercentSelect.value)&&(!optimizerSelect.value||run.optimizer?.name===optimizerSelect.value)&&(!weightDecaySelect.value||String(run.optimizer?.weight_decay)===weightDecaySelect.value)&&(!tyingSelect.value||String(run.wte_weight_tying)===tyingSelect.value));
  runList.innerHTML='';
  if(!filtered.includes(state.selected))state.selected=null;
  filtered.forEach(run=>{const schedule=run.transition_mode==='duty_cycle'?`${run.duty_cycle}% duty`:`${run.transition_mode} @ ${Math.round(100*run.dropout_iteration/run.final_iteration)}%`,optimizer=run.optimizer?.name||'legacy';const button=document.createElement('button');button.textContent=`${run.embedding_dim}D · ${optimizer}${run.optimizer?.muon_include_all_weights?' (full)':''} · wd ${run.optimizer?.weight_decay??'—'} · ${run.trained_tokens} trained · ${run.held_out_tokens} held · ${run.dropped_tokens} affected · ${schedule} · ${run.wte_weight_tying?'tied':'untied'} · ${run.fixed_norm==null?'free':`radius ${Number(run.fixed_norm).toFixed(2)}`}`;button.className=run===state.selected?'active':'';button.onclick=()=>selectRun(run);runList.appendChild(button)});
  if(!state.selected&&filtered.length)selectRun(filtered[0]);else updateUrl();
}
fetch('runs/manifest.json').then(response=>{if(!response.ok)throw new Error(`HTTP ${response.status}`);return response.json()}).then(manifest=>{state.runs=manifest.runs;[[dimSelect,'embedding_dim'],[trainedSelect,'trained_tokens'],[heldSelect,'held_out_tokens'],[droppedSelect,'dropped_tokens']].forEach(([select,key])=>unique(key).forEach(value=>select.add(new Option(value,value))));const radii=[...new Set(state.runs.map(run=>run.fixed_norm==null?'free':String(run.fixed_norm)))].sort((a,b)=>a==='free'?-1:b==='free'?1:Number(a)-Number(b));radii.forEach(value=>radiusSelect.add(new Option(value==='free'?'Free (unconstrained)':`Radius ${value}`,value)));[...new Set(state.runs.map(run=>run.transition_mode==='duty_cycle'?run.duty_cycle:Math.round(100*run.dropout_iteration/run.final_iteration)))].sort((a,b)=>a-b).forEach(value=>dropPercentSelect.add(new Option(`${value}%`,value)));[...new Set(state.runs.map(run=>run.optimizer?.name).filter(Boolean))].sort().forEach(value=>optimizerSelect.add(new Option(value,value)));[...new Set(state.runs.map(run=>run.optimizer?.weight_decay).filter(value=>value!=null))].sort((a,b)=>a-b).forEach(value=>weightDecaySelect.add(new Option(value,value)));const params=new URLSearchParams(location.search);Object.entries(filters).forEach(([key,select])=>{if(params.has(key)&&[...select.options].some(option=>option.value===params.get(key)))select.value=params.get(key)});state.selected=state.runs.find(run=>run.name===params.get('run'))||null;Object.values(filters).forEach(select=>select.onchange=()=>{state.selected=null;render()});render()}).catch(error=>runList.textContent=`Could not load sweep manifest: ${error.message}`);
</script></body></html>

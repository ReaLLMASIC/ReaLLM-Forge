<script>
const fig=document.getElementById('fig');
const marks=[...fig.querySelectorAll('.wire,.bkt,.cst,.prd,.src,.mul')];
function clear(){fig.removeAttribute('data-sel');marks.forEach(m=>m.classList.remove('hot'));}
fig.querySelectorAll('.src').forEach(g=>{
  const k=g.dataset.k, j=g.dataset.j;
  g.addEventListener('mouseenter',()=>{
    clear(); fig.setAttribute('data-sel',k);
    g.classList.add('hot');
    fig.querySelector('.wire[data-j="'+j+'"]').classList.add('hot');
    fig.querySelectorAll('.bkt[data-k="'+k+'"],.cst[data-k="'+k+'"],.prd[data-k="'+k+'"],.mul[data-k="'+k+'"]')
       .forEach(e=>e.classList.add('hot'));
  });
});
fig.addEventListener('mouseleave',clear);
</script>

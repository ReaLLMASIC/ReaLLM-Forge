# default.yaml using named group mechanisms from sample.yaml
---

named_static_groups:
  # QK Norm
  - named_group: "qk_norm"
    use_qk_norm: [true]
    use_qk_norm_scale: [true]

  # Norm Type
  - named_group: "peri_ln"
    use_pre_ln: [true]
    use_peri_ln: [true]
    use_post_ln: [false]

  # Position Embeddings
  - named_group: "rotary"
    named_group_settings:
      use_rotary_embeddings: [true]
      use_abs_pos_embeddings: [false]

  # MLP Activation
  - named_group: "squared_relu"
    named_group_settings:
      activation_variant: ["squared_relu"]

named_variation_groups:
  # Embedding norm sweep. `default` omits the option entirely; YAML `null`
  # preserves a Python None in the generated/logged config and omits the flag.
  - named_group: "wte_norm"
    norm_variant_wte: [default, "hyperspherenorm", null]

common_group:
  dataset: ["minipile"]
  eval_interval: [1000]
  max_iters: [10000]
  never_save_checkpoint: [true]

parameter_groups:
  - compile: [true]
    named_group_static:
      - "qk_norm"
      - "peri_ln"
      - "rotary"
      - "squared_relu"
    named_group_variations:
      - "wte_norm"

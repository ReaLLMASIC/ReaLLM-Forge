# explorations/multidataset.yaml
---
# Base hyperparameters
named_static_groups:
  - named_group: "1-10-10_200-1-1"
    dataset_sampling_probs: 
      - [1, 10, 10]
    dataset_sampling_probs_final: 
      - [200, 1, 1]

  - named_group: "1-10-10_20-1-1"
    dataset_sampling_probs: 
      - [1, 10, 10]
    dataset_sampling_probs_final: 
      - [20, 1, 1]

  - named_group: "1-10-10_10-1-1"
    dataset_sampling_probs: 
      - [1, 10, 10]
    dataset_sampling_probs_final: 
      - [10, 1, 1]

  - named_group: "linear"
    dataset_sampling_probs_transition_method: [linear]

  - named_group: "byte_jckj"
    dataset: [byte_ja]
    dataset_list: [byte_ja byte_ko byte_zh]
    training_mode: [multidataset]

  - named_group: "ipa_jckj"
    dataset: [commonvoice_ja]
    dataset_list: [commonvoice_ja commonvoice_ko commonvoice_zh]
    training_mode: [multidataset]

  - named_group: "tiktoken_jckj"
    dataset: [snac_cvja]
    dataset_list: [snac_cvja snac_cvko snac_cvzh]
    training_mode: [multidataset]

  - named_group: "one_hot_layer0"
    use_lsv: [true]
    lsv_variant: [one_hot]
    apply_lsv_at_layer_idx: [0]

  - named_group: "one_hot_layer6"
    use_lsv: [true]
    lsv_variant: [one_hot]
    apply_lsv_at_layer_idx: [6]

  - named_group: "ohmg_layer0"
    use_lsv: [true]
    lsv_variant: [ohmg]
    apply_lsv_at_layer_idx: [0]

  - named_group: "ohmg_layer6"
    use_lsv: [true]
    lsv_variant: [ohmg]
    apply_lsv_at_layer_idx: [6]

  - named_group: "without_lsv"
    use_lsv: [false]

  - named_group: "base_batch_iters"
    batch_size: [16]
    max_iters: [10000]

  - named_group: "byte_ja"
    dataset: [byte_ja]
    batch_size: [16]
    max_iters: [20600]

  - named_group: "byte_ko"
    dataset: [byte_ko]
    batch_size: [16]
    max_iters: [11500]

  - named_group: "byte_zh"
    dataset: [byte_zh]
    batch_size: [16]
    max_iters: [14100]

  - named_group: "commonvoice_ja"
    dataset: [commonvoice_ja]
    batch_size: [16]
    max_iters: [95100]

  - named_group: "snac_cvja"
    dataset: [snac_cvja]

  - named_group: "commonvoice_ko"
    dataset: [commonvoice_ko]
    batch_size: [16]
    max_iters: [23100]

  - named_group: "snac_cvko"
    dataset: [snac_cvko]

  - named_group: "commonvoice_zh"
    dataset: [commonvoice_zh]
    batch_size: [16]
    max_iters: [83100]

  - named_group: "snac_cvzh"
    dataset: [snac_cvzh]

named_variation_groups:
  - named_group: "batch_sweep"
    parameter_groups:
      - batch_size: [16]
        max_iters: [10000]
      - batch_size: [8]
        max_iters: [20000]
      - batch_size: [4]
        max_iters: [40000]
      - batch_size: [2]
        max_iters: [80000]
      - batch_size: [1]
        max_iters: [160000]
      - batch_size: [32]
        max_iters: [5000]
      - batch_size: [64]
        max_iters: [2500]

common_group:
  # training_mode: [multidataset]
  dataset_interleaving: [false]
  learning_rate: [6e-4]
  n_layer: [12]
  n_head: [12]
  n_embd: [768]
  block_size: [1024]
  use_rotary_embeddings: [true]
  use_abs_pos_embeddings: [false]
  use_qk_norm: [true]
  use_qk_norm_scale: [true]
  use_peri_ln: [true]
  use_gradient_checkpoint: [true]
  max_sample_tokens: [100]
  eval_interval: [1000]
  sample_each_eval: [true]
  compile: [true]
  seed: [1, 2, 3, 4, 5]

parameter_groups:
  - named_group_static: ["commonvoice_ko"]
    tensorboard_run_name: "ipa_single_run_ko"

  - named_group_static: ["snac_cvko", "base_batch_iters"]
    tensorboard_run_name: "tiktoken_single_run_ko"

  - named_group_static: ["commonvoice_zh"]
    tensorboard_run_name: "ipa_single_run_zh"

  - named_group_static: ["snac_cvzh", "base_batch_iters"]
    tensorboard_run_name: "tiktoken_single_run_zh"

  - named_group_static: ["commonvoice_ja"]
    tensorboard_run_name: "ipa_single_run_ja"

  - named_group_static: ["snac_cvja", "base_batch_iters"]
    tensorboard_run_name: "tiktoken_single_run_ja"

  

# Compare standard additive residuals with Full Attention Residuals while
# preserving the architecture and sweeps from default_inf.yaml.
---

named_static_groups:
  # QK Norm
  - named_group: "qk_norm"
    use_qk_norm: [true]
    use_qk_norm_scale: [true]

  # Norm Type
  - named_group: "peri_ln"
    use_pre_ln: [true]
    use_peri_ln: [true]
    use_post_ln: [false]

  # Position Embeddings
  - named_group: "rotary"
    use_rotary_embeddings: [true]
    use_abs_pos_embeddings: [false]

  # MLP Activation
  - named_group: "squared_relu"
    activation_variant: ["squared_relu"]

  # Attention softmax variants
  - named_group: "relu2max"
    softmax_variant_attn: ["relu2max"]

  - named_group: "softmax"
    softmax_variant_attn: ["softmax"]

  # Infinite Attention
  - named_group: "infinite"
    attention_variant: ["infinite"]
    use_concat_heads: [true]

  # Head Dimension
  - named_group: "hd_100"
    n_qk_head_dim: [100]
    n_v_head_dim: [100]

  - named_group: "hd_150"
    n_qk_head_dim: [150]
    n_v_head_dim: [150]

  - named_group: "hd_200"
    n_qk_head_dim: [200]
    n_v_head_dim: [200]

  # MQA
  - named_group: "mqa"
    n_kv_group: [1]

  # Residual architecture comparison
  - named_group: "standard_residual"
    attention_residual_variant: ["standard"]

  - named_group: "full_attention_residual"
    attention_residual_variant: ["full"]

named_variation_groups:
  - named_group: "head_dimension"
    named_group_alternates: ["hd_100", "hd_150", "hd_200"]

  - named_group: "residual_architecture"
    named_group_alternates: ["standard_residual", "full_attention_residual"]

common_group:
  dataset: ["minipile"]
  eval_interval: [2500]
  max_iters: [10000]
  never_save_checkpoint: [true]
  compile: [true]
  log_rankme: [true]
  log_areq: [true]


optimizer: ["muon"]
weight_decay: [0.0]
muon_momentum: [0.95]
muon_ns_steps: [5]
muon_nesterov: [true]
muon_min_ndim: [2]

parameter_groups:
  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "squared_relu"
      - "relu2max"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"

  - named_group_static:
      - "qk_norm"
      - "peri_ln"
      - "rotary"
      - "softmax"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"

  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "squared_relu"
      - "relu2max"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    muon_exclude_substrings:
      - [" "]

  - named_group_static:
      - "qk_norm"
      - "peri_ln"
      - "rotary"
      - "softmax"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    muon_exclude_substrings:
      - [" "]

  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "softmax"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    muon_exclude_substrings:
      - [" "]

  # CAPPED HS NORM AND HSNORM VARIATONIS
  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "squared_relu"
      - "relu2max"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    muon_exclude_substrings:
      - [" "]
    norm_variant_output: ["cappedhyperspherenorm", "rmsnorm"]

  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "squared_relu"
      - "relu2max"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    muon_exclude_substrings:
      - [" "]
    norm_variant_output: ["cappedhyperspherenorm", "rmsnorm"]
    norm_variant_wte: ["rmsnorm", "hyperspherenorm"]

  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "squared_relu"
      - "relu2max"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    muon_exclude_substrings:
      - [" "]
    norm_variant_output: ["cappedhyperspherenorm", "rmsnorm", "hyperspherenorm"]
    norm_variant_wte: ["rmsnorm", "hyperspherenorm"]
    norm_variant_attn: ["cappedhyperspherenorm"]
    use_peri_ln: [true, false]

  # CAPPED HS NORM AND HSNORM VARIATONS WITHOUT THE exclude substrings
  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "squared_relu"
      - "relu2max"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    norm_variant_output: ["cappedhyperspherenorm", "rmsnorm"]

  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "squared_relu"
      - "relu2max"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    norm_variant_output: ["cappedhyperspherenorm", "rmsnorm"]
    norm_variant_wte: ["rmsnorm", "hyperspherenorm"]

  - named_group_static:
      - "qk_norm"
      - "rotary"
      - "squared_relu"
      - "relu2max"
      - "infinite"
      - "hd_100"
    named_group_variations:
      - "residual_architecture"
    norm_variant_output: ["cappedhyperspherenorm", "rmsnorm", "hyperspherenorm"]
    norm_variant_wte: ["rmsnorm", "hyperspherenorm"]
    norm_variant_attn: ["cappedhyperspherenorm"]
    use_peri_ln: [true, false]


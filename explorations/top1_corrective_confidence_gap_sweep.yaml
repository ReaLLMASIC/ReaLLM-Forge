---
# Explore the merged corrective-CE and confidence-gap objective. The Cartesian
# product below compares each corrective boost against each confidence-gap
# weight (nine merged-loss runs), alongside a standard cross-entropy baseline.

common_group:
  max_iters: [10000]
  n_layer: [6]
  n_head: [6]
  n_embd: [384]
  block_size: [256]
  eval_interval: [500]
  dataset: ["minipile"]
  dtype: ["bfloat16"]
  compile: [true]
  never_save_checkpoint: [true]
  use_rotary_embeddings: [true]
  use_abs_pos_embeddings: [false]
  use_qk_norm: [true]
  use_qk_norm_scale: [true]
  use_peri_ln: [true]
  norm_variant_wte: ["hyperspherenorm"]
  norm_variant_attn: ["hyperspherenorm"]
  norm_variant_output: ["hyperspherenorm"]
  hsnorm_gain: [false]
  hsnorm_scale: ["1.0"]
  norm_wte_scale: ["1.0"]
  optimizer: ["muon"]
  weight_decay: [0]

parameter_groups:
  - loss_fn: ["top1_corrective_confidence_gap"]
    top1_corrective_boost: [0.25, 0.5, 0.75]
    top1_confidence_gap_beta: [0.25, 0.5, 0.75]

  - loss_fn: ["top1_corrective_ce"]
    top1_corrective_boost: [0.25, 0.5, 0.75]

  - loss_fn: ["top1_confidence_gap"]
    top1_confidence_gap_beta: [0.25, 0.5, 0.75]
